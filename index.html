<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseChat — Live Online Chat, Chess &amp; Admin Workspace</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chess.js@0.12.1/chess.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: { 950: '#090d16', 900: '#0f1624', 850: '#141d2e', 800: '#1a253a', 700: '#25334d' }
          }
        }
      }
    };
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #090d16; color: #e2e8f0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #25334d; border-radius: 9999px; }
    .msg-row:hover .msg-actions { opacity: 1; pointer-events: auto; }
    .msg-actions { opacity: 0; pointer-events: none; transition: opacity .15s ease; }
    @media (max-width: 768px) { .msg-actions { opacity: 1; pointer-events: auto; } }
    .glass-card { background: rgba(15, 22, 36, .88); backdrop-filter: blur(16px); }
    .sq-light { background-color: #cbd5e1; color: #1e293b; }
    .sq-dark { background-color: #475569; color: #e2e8f0; }
    .sq-selected { box-shadow: inset 0 0 0 3px #6366f1; background-color: #818cf8 !important; }
    .sq-last { background-color: rgba(250, 204, 21, 0.42) !important; }
    .sq-check { background-color: rgba(244, 63, 94, 0.72) !important; }
    .piece-w { color: #ffffff; text-shadow: 0 1px 3px rgba(0,0,0,0.85), 0 0 1px rgba(0,0,0,0.95); }
    .piece-b { color: #0f172a; text-shadow: 0 1px 1px rgba(255,255,255,0.45); }
  </style>
</head>
<body class="h-full antialiased">
  <div id="app" class="h-full flex flex-col"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script>
    const DEFAULT_SUPABASE_URL = 'https://afujvzkwrzhytrtjfytr.supabase.co';
    const DEFAULT_SUPABASE_KEY = 'sb_publishable_iVtmYzJh6VRNafqnZCmGFg_-FNm0I3f';
    const EMOJIS = ['😀', '🔥', '🚀', '👍', '❤️', '🎉', '👀', '💡', '✅', '🙏', '😂', '⚡'];
    const PIECE_GLYPHS = {
      wp: '♙', wn: '♘', wb: '♗', wr: '♖', wq: '♕', wk: '♔',
      bp: '♟', bn: '♞', bb: '♝', br: '♜', bq: '♛', bk: '♚',
    };
    const PIECE_VALUES = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

    function safeGet(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }

    const sbUrl = safeGet('pulsechat_sb_url') || DEFAULT_SUPABASE_URL;
    const sbKey = safeGet('pulsechat_sb_key') || DEFAULT_SUPABASE_KEY;
    const sb = window.supabase.createClient(sbUrl, sbKey);
    let rtChannel = null;
    let audioCtx = null;

    const state = {
      authTab: 'login',
      authLoading: false,
      authError: '',
      showPw: false,
      sessionUser: null,
      me: null,
      view: 'chat', // 'chat' | 'games' | 'admin'
      adminTab: 'users',
      activeRoomId: 'general',
      searchQuery: '',
      adminUserSearch: '',
      adminMsgSearch: '',
      editingMsgId: null,
      editingText: '',
      composerText: '',
      showEmoji: false,
      mobileSidebar: false,
      annDismissed: false,
      users: [],
      rooms: [],
      messages: [],
      allMessages: [],
      announcement: null,
      loadingData: false,
      // Chess Games state
      chessTab: 'lobby', // 'lobby' | 'online' | 'bot'
      chessGames: [],
      activeGameId: null,
      selectedSquare: null,
      legalTargets: [],
      boardFlipped: false,
      chessMuted: false,
      botDifficulty: 'medium', // 'easy' | 'medium'
      botFen: 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1',
      botHistory: [],
      botLastMove: '',
      botThinking: false,
    };

    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function initials(n) {
      const p = String(n || 'U').trim().split(/\s+/);
      return (p[0][0] + (p[1] ? p[1][0] : '')).toUpperCase();
    }
    function fmtTime(ts) {
      if (!ts) return '';
      return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    function toast(msg, type = 'info') {
      const root = document.getElementById('toast-root');
      if (!root) return;
      const cls = {
        success: 'bg-emerald-500/15 border-emerald-500/40 text-emerald-200',
        error: 'bg-rose-500/15 border-rose-500/40 text-rose-200',
        info: 'bg-indigo-500/15 border-indigo-500/40 text-indigo-200',
      }[type] || 'bg-indigo-500/15 border-indigo-500/40 text-indigo-200';
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-2.5 rounded-xl border text-sm font-medium shadow-xl backdrop-blur-md transition ${cls}`;
      el.textContent = msg;
      root.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 220); }, 3000);
    }
    function scrollBottom() {
      setTimeout(() => { const el = document.getElementById('messages-scroll'); if (el) el.scrollTop = el.scrollHeight; }, 40);
    }
    function icons() { if (window.lucide) window.lucide.createIcons(); }
    function playMoveSound(capture = false) {
      if (state.chessMuted) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(capture ? 220 : 340, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (_) {}
    }

    // =========================================================================
    // DATA LOADING & REALTIME
    // =========================================================================
    async function loadWorkspaceData(shouldScroll = false) {
      if (!state.sessionUser) return;
      state.loadingData = true;
      try {
        const [uRes, rRes, aRes, gRes] = await Promise.all([
          sb.from('profiles').select('*').order('created_at', { ascending: true }),
          sb.from('rooms').select('*').order('created_at', { ascending: true }),
          sb.from('announcements').select('*').eq('id', 'active').maybeSingle(),
          sb.from('chess_games').select('*').order('updated_at', { ascending: false }).limit(30),
        ]);
        if (uRes.error) toast('Profile load error: ' + uRes.error.message, 'error');
        if (rRes.error) toast('Rooms load error: ' + rRes.error.message, 'error');
        if (uRes.data) {
          state.users = uRes.data;
          state.me = state.users.find(u => u.id === state.sessionUser.id) || state.me;
        }
        if (!state.me && state.sessionUser) {
          state.me = {
            id: state.sessionUser.id,
            name: state.sessionUser.user_metadata?.name || (state.sessionUser.email || 'User').split('@')[0],
            email: state.sessionUser.email || '',
            role: state.users.length === 0 ? 'admin' : 'member',
            muted: false,
            banned: false,
            color: '#6366f1',
          };
        }
        if (rRes.data) {
          state.rooms = rRes.data;
          if (!state.rooms.find(r => r.id === state.activeRoomId) && state.rooms.length) {
            state.activeRoomId = state.rooms[0].id;
          }
        }
        state.announcement = aRes.data && aRes.data.text ? aRes.data : null;
        if (gRes.data) state.chessGames = gRes.data;
        if (state.view === 'chat') await loadRoomMessages(shouldScroll);
        if (state.me?.role === 'admin' && state.view === 'admin') {
          const allRes = await sb.from('messages').select('*').order('created_at', { ascending: false }).limit(200);
          if (allRes.data) state.allMessages = allRes.data;
        }
      } catch (err) {
        toast('Sync error: ' + err.message, 'error');
      } finally {
        state.loadingData = false;
        render();
      }
    }

    async function loadRoomMessages(shouldScroll = false) {
      if (!state.activeRoomId) return;
      const { data } = await sb.from('messages').select('*').eq('room_id', state.activeRoomId).order('created_at', { ascending: true });
      if (data) state.messages = data;
      render();
      if (shouldScroll) scrollBottom();
    }

    async function loadChessGames() {
      const { data, error } = await sb.from('chess_games').select('*').order('updated_at', { ascending: false }).limit(30);
      if (error) toast('Chess sync error: ' + error.message, 'error');
      if (data) state.chessGames = data;
      render();
    }

    function setupRealtime() {
      if (rtChannel) { try { sb.removeChannel(rtChannel); } catch (_) {} }
      rtChannel = sb.channel('pulse-live')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => { if (state.view === 'chat') loadRoomMessages(true); else if (state.view === 'admin') loadWorkspaceData(false); })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms' }, () => loadWorkspaceData(false))
        .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => loadWorkspaceData(false))
        .on('postgres_changes', { event: '*', schema: 'public', table: 'announcements' }, () => { state.annDismissed = false; loadWorkspaceData(false); })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'chess_games' }, () => { loadChessGames(); })
        .subscribe();
    }

    // =========================================================================
    // AUTH & CHAT ACTIONS
    // =========================================================================
    async function handleAuth(e) {
      e.preventDefault();
      const email = (e.target.email?.value || '').trim().toLowerCase();
      const password = e.target.password?.value || '';
      const name = (e.target.displayName?.value || '').trim();
      if (!email || password.length < 6) {
        state.authError = 'Enter a valid email and a password of at least 6 characters.';
        render();
        return;
      }
      state.authError = '';
      state.authLoading = true;
      render();
      try {
        if (state.authTab === 'signup') {
          const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name: name || email.split('@')[0] } } });
          if (error) throw error;
          if (!data.session) {
            toast('Account created! Please sign in.', 'success');
            state.authTab = 'login';
          } else {
            toast('Welcome to PulseChat!', 'success');
          }
        } else {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
          toast('Signed in!', 'success');
        }
      } catch (err) {
        state.authError = err.message || 'Authentication failed';
      } finally {
        state.authLoading = false;
        render();
      }
    }

    async function signOut() {
      if (rtChannel) { try { sb.removeChannel(rtChannel); } catch (_) {} rtChannel = null; }
      await sb.auth.signOut();
      state.sessionUser = null;
      state.me = null;
      state.view = 'chat';
      toast('Signed out', 'info');
      render();
    }

    async function sendMessage(e) {
      e.preventDefault();
      const text = state.composerText.trim();
      if (!text || !state.me) return;
      if (state.me.muted) return toast('You are muted by an admin.', 'error');
      state.composerText = '';
      state.showEmoji = false;
      render();
      const { error } = await sb.from('messages').insert({
        room_id: state.activeRoomId,
        uid: state.me.id,
        author_name: state.me.name,
        author_role: state.me.role,
        author_color: state.me.color || '#6366f1',
        text,
      });
      if (error) toast('Failed to send: ' + error.message, 'error');
      else await loadRoomMessages(true);
    }

    async function saveEdit(msgId) {
      const text = state.editingText.trim();
      if (!text) return toast('Message cannot be empty.', 'error');
      const { error } = await sb.from('messages').update({ text, edited: true, edited_at: new Date().toISOString() }).eq('id', msgId);
      if (error) toast('Edit failed: ' + error.message, 'error');
      else toast('Message updated', 'success');
      state.editingMsgId = null;
      state.editingText = '';
      await loadRoomMessages(false);
    }

    function openConfirm(title, body, label, onConfirm) {
      document.getElementById('modal-root').innerHTML = `
        <div id="m-bg" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
          <div class="w-full max-w-md rounded-2xl bg-surface-900 border border-slate-700/70 p-6 shadow-2xl">
            <h3 class="text-lg font-semibold text-white">${esc(title)}</h3>
            <p class="mt-2 text-sm text-slate-400">${esc(body)}</p>
            <div class="mt-6 flex justify-end gap-2">
              <button type="button" id="m-no" class="px-4 py-2 rounded-xl text-sm bg-surface-800 hover:bg-surface-700 text-slate-200">Cancel</button>
              <button type="button" id="m-yes" class="px-4 py-2 rounded-xl text-sm bg-rose-600 hover:bg-rose-500 text-white font-medium">${esc(label)}</button>
            </div>
          </div>
        </div>`;
      const close = () => { document.getElementById('modal-root').innerHTML = ''; };
      document.getElementById('m-no').addEventListener('click', close);
      document.getElementById('m-bg').addEventListener('click', (e) => { if (e.target.id === 'm-bg') close(); });
      document.getElementById('m-yes').addEventListener('click', async () => { close(); await onConfirm(); });
    }

    function openPromotionModal(color, onPick) {
      const opts = [['q', 'Queen'], ['r', 'Rook'], ['b', 'Bishop'], ['n', 'Knight']];
      document.getElementById('modal-root').innerHTML = `
        <div id="m-bg" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
          <div class="w-full max-w-xs rounded-2xl bg-surface-900 border border-slate-700/70 p-5 shadow-2xl text-center">
            <h3 class="text-base font-semibold text-white mb-3">Promote Pawn</h3>
            <div class="grid grid-cols-4 gap-2">
              ${opts.map(([p, label]) => `<button type="button" data-promo="${p}" class="promo-btn flex flex-col items-center p-3 rounded-xl bg-surface-800 hover:bg-indigo-600/40 border border-slate-700 transition"><span class="text-3xl ${color === 'w' ? 'piece-w' : 'piece-b'}">${PIECE_GLYPHS[color + p]}</span><span class="text-[10px] text-slate-300 mt-1">${label}</span></button>`).join('')}
            </div>
          </div>
        </div>`;
      document.querySelectorAll('.promo-btn').forEach(b => b.addEventListener('click', () => {
        const piece = b.dataset.promo;
        document.getElementById('modal-root').innerHTML = '';
        onPick(piece);
      }));
    }

    function deleteMessage(msgId) {
      openConfirm('Delete Message', 'Permanently delete this message?', 'Delete', async () => {
        const { error } = await sb.from('messages').delete().eq('id', msgId);
        if (error) toast('Delete failed: ' + error.message, 'error');
        else { toast('Message deleted', 'info'); await loadWorkspaceData(false); }
      });
    }

    // =========================================================================
    // ADMIN ACTIONS
    // =========================================================================
    async function adminUpdateUser(uid, updates, msg) {
      if (uid === state.me?.id) return toast('Cannot modify your own admin status.', 'error');
      const { error } = await sb.from('profiles').update(updates).eq('id', uid);
      if (error) toast('Update failed: ' + error.message, 'error');
      else { toast(msg, 'success'); await loadWorkspaceData(false); }
    }

    async function adminCreateRoom(e) {
      e.preventDefault();
      const slug = (e.target.channelName?.value || '').trim().toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-|-$/g, '');
      const description = (e.target.channelDesc?.value || '').trim() || 'Discussion channel';
      if (!slug) return toast('Enter a valid channel name.', 'error');
      const { error } = await sb.from('rooms').insert({ id: slug, name: slug, description });
      if (error) toast('Failed: ' + error.message, 'error');
      else { toast(`Created #${slug}`, 'success'); e.target.reset(); await loadWorkspaceData(false); }
    }

    function adminDeleteRoom(roomId) {
      if (roomId === 'general') return toast('Cannot delete #general.', 'error');
      openConfirm(`Delete #${roomId}`, 'This removes the channel and its messages.', 'Delete Channel', async () => {
        const { error } = await sb.from('rooms').delete().eq('id', roomId);
        if (error) toast('Delete failed: ' + error.message, 'error');
        else {
          if (state.activeRoomId === roomId) state.activeRoomId = 'general';
          toast(`Deleted #${roomId}`, 'info');
          await loadWorkspaceData(false);
        }
      });
    }

    async function adminBroadcast(e) {
      e.preventDefault();
      const text = (e.target.announcementText?.value || '').trim();
      const { error } = await sb.from('announcements').upsert({ id: 'active', text, author_name: state.me.name, updated_at: new Date().toISOString() });
      if (error) toast('Failed: ' + error.message, 'error');
      else { toast(text ? 'Announcement published' : 'Announcement cleared', 'success'); state.annDismissed = false; await loadWorkspaceData(false); }
    }

    // =========================================================================
    // CHESS ENGINE (ONLINE MULTIPLAYER + BOT AI)
    // =========================================================================
    function getActiveOnlineGame() {
      return state.chessGames.find(g => g.id === state.activeGameId) || null;
    }

    async function createOnlineChessGame() {
      if (!state.me) return;
      const { data, error } = await sb.from('chess_games').insert({
        white_id: state.me.id,
        white_name: state.me.name,
        status: 'waiting',
      }).select().single();
      if (error) return toast('Could not create game: ' + error.message, 'error');
      state.activeGameId = data.id;
      state.chessTab = 'online';
      state.boardFlipped = false;
      state.selectedSquare = null;
      state.legalTargets = [];
      toast('Match created! Share with anyone in chat to join.', 'success');
      await loadChessGames();
    }

    async function joinOnlineChessGame(gameId) {
      if (!state.me) return;
      const g = state.chessGames.find(x => x.id === gameId);
      if (!g) return;
      if (g.status === 'waiting' && g.white_id !== state.me.id && !g.black_id) {
        const { error } = await sb.from('chess_games').update({
          black_id: state.me.id,
          black_name: state.me.name,
          status: 'active',
          updated_at: new Date().toISOString(),
        }).eq('id', gameId);
        if (error) return toast('Could not join: ' + error.message, 'error');
        toast('Joined match as Black!', 'success');
        state.boardFlipped = true;
      } else {
        state.boardFlipped = g.black_id === state.me.id;
      }
      state.activeGameId = gameId;
      state.chessTab = 'online';
      state.selectedSquare = null;
      state.legalTargets = [];
      await loadChessGames();
    }

    function deleteOnlineChessGame(gameId) {
      openConfirm('Delete Match', 'Remove this chess match from the lobby?', 'Delete', async () => {
        const { error } = await sb.from('chess_games').delete().eq('id', gameId);
        if (error) toast('Delete failed: ' + error.message, 'error');
        else {
          if (state.activeGameId === gameId) { state.activeGameId = null; state.chessTab = 'lobby'; }
          toast('Match removed', 'info');
          await loadChessGames();
        }
      });
    }

    function resignOnlineChessGame(game) {
      openConfirm('Resign Match', 'Are you sure you want to resign this game?', 'Resign', async () => {
        const winner = game.white_id === state.me.id ? 'Black wins by resignation' : 'White wins by resignation';
        const { error } = await sb.from('chess_games').update({
          status: 'finished',
          result: winner,
          updated_at: new Date().toISOString(),
        }).eq('id', game.id);
        if (error) toast('Resign failed: ' + error.message, 'error');
        else { toast(winner, 'info'); await loadChessGames(); }
      });
    }

    function evaluateBoard(chess) {
      const b = chess.board();
      let score = 0;
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = b[r][c];
          if (!p) continue;
          const centerBonus = (r >= 2 && r <= 5 && c >= 2 && c <= 5) ? 12 : 0;
          const val = (PIECE_VALUES[p.type] || 0) + centerBonus;
          score += p.color === 'b' ? val : -val;
        }
      }
      return score;
    }

    function pickBotMove(chess) {
      const moves = chess.moves({ verbose: true });
      if (!moves.length) return null;
      if (state.botDifficulty === 'easy') {
        const caps = moves.filter(m => m.captured);
        if (caps.length && Math.random() < 0.6) return caps[Math.floor(Math.random() * caps.length)];
        return moves[Math.floor(Math.random() * moves.length)];
      }
      // Medium: 2-ply minimax (black maximizes)
      let bestMove = moves[0];
      let bestScore = -Infinity;
      for (const m of moves) {
        chess.move(m);
        let score;
        if (chess.in_checkmate()) {
          score = 99999;
        } else {
          const replies = chess.moves({ verbose: true });
          let worstReply = Infinity;
          for (const r of replies) {
            chess.move(r);
            const ev = evaluateBoard(chess);
            if (ev < worstReply) worstReply = ev;
            chess.undo();
          }
          score = replies.length ? worstReply : 0;
        }
        chess.undo();
        score += (Math.random() - 0.5) * 6;
        if (score > bestScore) { bestScore = score; bestMove = m; }
      }
      return bestMove;
    }

    function resetBotGame() {
      state.botFen = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
      state.botHistory = [];
      state.botLastMove = '';
      state.botThinking = false;
      state.selectedSquare = null;
      state.legalTargets = [];
      state.boardFlipped = false;
      render();
    }

    function undoBotMove() {
      if (state.botThinking || state.botHistory.length === 0) return;
      const chess = new window.Chess();
      const targetLen = Math.max(0, state.botHistory.length - 2);
      for (let i = 0; i < targetLen; i++) chess.move(state.botHistory[i]);
      state.botFen = chess.fen();
      state.botHistory = state.botHistory.slice(0, targetLen);
      state.botLastMove = '';
      state.selectedSquare = null;
      state.legalTargets = [];
      render();
    }

    async function executeChessMove(mode, from, to, promotion = 'q') {
      if (mode === 'bot') {
        const chess = new window.Chess(state.botFen);
        const mv = chess.move({ from, to, promotion });
        if (!mv) return;
        playMoveSound(Boolean(mv.captured));
        state.botFen = chess.fen();
        state.botHistory.push(mv.san);
        state.botLastMove = from + to;
        state.selectedSquare = null;
        state.legalTargets = [];
        render();
        if (!chess.game_over() && chess.turn() === 'b') {
          state.botThinking = true;
          render();
          setTimeout(() => {
            const c2 = new window.Chess(state.botFen);
            const botMv = pickBotMove(c2);
            if (botMv) {
              const applied = c2.move(botMv);
              playMoveSound(Boolean(applied.captured));
              state.botFen = c2.fen();
              state.botHistory.push(applied.san);
              state.botLastMove = applied.from + applied.to;
            }
            state.botThinking = false;
            render();
          }, 320);
        }
        return;
      }

      const game = getActiveOnlineGame();
      if (!game) return;
      const chess = new window.Chess(game.fen);
      const mv = chess.move({ from, to, promotion });
      if (!mv) return;
      playMoveSound(Boolean(mv.captured));
      let status = game.status;
      let result = '';
      if (chess.in_checkmate()) {
        status = 'finished';
        result = chess.turn() === 'w' ? 'Checkmate — Black wins!' : 'Checkmate — White wins!';
      } else if (chess.in_stalemate()) {
        status = 'finished';
        result = 'Draw by stalemate';
      } else if (chess.in_draw()) {
        status = 'finished';
        result = 'Draw';
      }
      const nextPgn = game.pgn ? `${game.pgn} ${mv.san}` : mv.san;
      state.selectedSquare = null;
      state.legalTargets = [];
      const { error } = await sb.from('chess_games').update({
        fen: chess.fen(),
        pgn: nextPgn,
        turn: chess.turn(),
        status,
        result,
        last_move: from + to,
        updated_at: new Date().toISOString(),
      }).eq('id', game.id);
      if (error) toast('Move sync error: ' + error.message, 'error');
      else await loadChessGames();
    }

    function handleSquareClick(sq) {
      const mode = state.chessTab; // 'online' | 'bot'
      let fen, canMoveColor = null;
      if (mode === 'bot') {
        if (state.botThinking) return;
        fen = state.botFen;
        canMoveColor = 'w';
      } else {
        const g = getActiveOnlineGame();
        if (!g || g.status !== 'active') return;
        fen = g.fen;
        if (g.white_id === state.me.id) canMoveColor = 'w';
        else if (g.black_id === state.me.id) canMoveColor = 'b';
        else return; // spectator
      }

      const chess = new window.Chess(fen);
      if (chess.game_over() || chess.turn() !== canMoveColor) return;

      if (state.selectedSquare && state.legalTargets.includes(sq)) {
        const piece = chess.get(state.selectedSquare);
        const isPromo = piece && piece.type === 'p' && ((piece.color === 'w' && sq[1] === '8') || (piece.color === 'b' && sq[1] === '1'));
        const from = state.selectedSquare;
        if (isPromo) {
          openPromotionModal(piece.color, (promo) => executeChessMove(mode, from, sq, promo));
        } else {
          executeChessMove(mode, from, sq, 'q');
        }
        return;
      }

      const clicked = chess.get(sq);
      if (clicked && clicked.color === canMoveColor) {
        state.selectedSquare = sq;
        state.legalTargets = chess.moves({ square: sq, verbose: true }).map(m => m.to);
      } else {
        state.selectedSquare = null;
        state.legalTargets = [];
      }
      render();
    }

    function renderChessBoardHtml(fen, lastMove, flipped) {
      const chess = new window.Chess(fen);
      const board = chess.board();
      const inCheck = chess.in_check();
      const turn = chess.turn();
      const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
      const fromSq = lastMove ? lastMove.slice(0, 2) : '';
      const toSq = lastMove ? lastMove.slice(2, 4) : '';
      let squares = '';
      for (let rIdx = 0; rIdx < 8; rIdx++) {
        const r = flipped ? 7 - rIdx : rIdx;
        for (let cIdx = 0; cIdx < 8; cIdx++) {
          const c = flipped ? 7 - cIdx : cIdx;
          const sq = files[c] + (8 - r);
          const isLight = (r + c) % 2 === 0;
          const piece = board[r][c];
          const isSel = state.selectedSquare === sq;
          const isTarget = state.legalTargets.includes(sq);
          const isLast = sq === fromSq || sq === toSq;
          const isKingCheck = inCheck && piece && piece.type === 'k' && piece.color === turn;
          const extra = isKingCheck ? 'sq-check' : (isSel ? 'sq-selected' : (isLast ? 'sq-last' : ''));
          const glyph = piece ? PIECE_GLYPHS[piece.color + piece.type] : '';
          squares += `
            <button type="button" data-sq="${sq}" class="chess-sq relative flex items-center justify-center select-none aspect-square ${isLight ? 'sq-light' : 'sq-dark'} ${extra}">
              ${cIdx === 0 ? `<span class="absolute top-0.5 left-1 text-[9px] font-bold opacity-60 pointer-events-none">${8 - r}</span>` : ''}
              ${rIdx === 7 ? `<span class="absolute bottom-0.5 right-1 text-[9px] font-bold opacity-60 pointer-events-none">${files[c]}</span>` : ''}
              ${glyph ? `<span class="text-2xl sm:text-4xl leading-none pointer-events-none ${piece.color === 'w' ? 'piece-w' : 'piece-b'}">${glyph}</span>` : ''}
              ${isTarget ? (piece ? '<span class="absolute inset-1 rounded-full border-4 border-indigo-500/80 pointer-events-none"></span>' : '<span class="w-3 h-3 rounded-full bg-indigo-500/75 pointer-events-none"></span>') : ''}
            </button>`;
        }
      }
      return `<div class="grid grid-cols-8 w-full max-w-[460px] mx-auto rounded-2xl overflow-hidden border-2 border-slate-700/80 shadow-2xl">${squares}</div>`;
    }

    function renderMoveHistory(moves) {
      if (!moves.length) return '<div class="text-xs text-slate-500">No moves yet.</div>';
      const rows = [];
      for (let i = 0; i < moves.length; i += 2) {
        rows.push(`<div class="grid grid-cols-[28px_1fr_1fr] gap-2 text-xs py-1 border-b border-slate-800/60"><span class="text-slate-500">${Math.floor(i / 2) + 1}.</span><span class="text-slate-200 font-mono">${esc(moves[i])}</span><span class="text-slate-300 font-mono">${esc(moves[i + 1] || '')}</span></div>`);
      }
      return rows.join('');
    }

      } else if (state.chessTab === 'online' && activeGame) {

        const myTurn = activeGame.status === 'active' && ((isWhite && activeGame.turn === 'w') || (isBlack && activeGame.turn === 'b'));
        const statusText = activeGame.status === 'waiting'
          ? 'Waiting for an opponent to join as Black...'
          : activeGame.status === 'finished'
            ? (activeGame.result || 'Game Over')
            : (chess.in_check() ? `Check! ${activeGame.turn === 'w' ? 'White' : 'Black'} to move` : (myTurn ? 'Your turn!' : `${activeGame.turn === 'w' ? activeGame.white_name : activeGame.black_name}'s turn`));
        content = `
          <div class="grid lg:grid-cols-[1fr_300px] gap-6 items-start">

              </div>
              ${renderChessBoardHtml(activeGame.fen, activeGame.last_move, state.boardFlipped)}
              <div class="flex items-center justify-between max-w-[460px] mx-auto px-3 py-2 rounded-xl bg-surface-900 border border-slate-800 text-xs">
                <span class="font-semibold text-white">${esc(state.boardFlipped ? (activeGame.black_name || 'Black') : activeGame.white_name)}</span>
                <span class="text-slate-400">${state.boardFlipped ? 'Black' : 'White'}</span>
              </div>

            <div class="rounded-2xl bg-surface-900 border border-slate-800 p-4 space-y-4">
              <div class="px-3.5 py-2.5 rounded-xl text-xs font-semibold ${activeGame.status === 'finished' ? 'bg-indigo-500/20 text-indigo-200' : (myTurn ? 'bg-emerald-500/20 text-emerald-300' : 'bg-surface-950 text-slate-300')}">${esc(statusText)}</div>

        let statusText = state.botThinking ? 'Bot is thinking...' : 'Your turn (White)';
        if (chess.in_checkmate()) statusText = chess.turn() === 'w' ? 'Checkmate — Bot wins!' : 'Checkmate — You win!';

                  <option value="medium" ${state.botDifficulty === 'medium' ? 'selected' : ''}>Medium</option>
                </select>
              </div>
              <div class="flex flex-wrap gap-2">
                <button type="button" id="btn-bot-undo" class="px-3 py-1.5 rounded-lg bg-surface-800 hover:bg-surface-700 text-xs text-slate-200">Undo</button>
                <button type="button" id="btn-bot-new" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-xs text-white font-medium">New Game</button>
                <button type="button" id="btn-flip-board" class="px-3 py-1.5 rounded-lg bg-surface-800 hover:bg-surface-700 text-xs text-slate-200">Flip</button>

              </div>
              <div>
                <div class="text-xs font-semibold text-slate-400 mb-2">Move History</div>
                <div class="max-h-60 overflow-y-auto pr-1">${renderMoveHistory(state.botHistory)}</div>
              </div>
            </div>
          </div>`;
      }

      return `
        <main class="flex-1 flex flex-col min-w-0 h-full bg-surface-950 overflow-y-auto">
          <header class="px-4 sm:px-6 py-4 border-b border-slate-800/80 bg-surface-900/70 backdrop-blur-md flex flex-wrap items-center justify-between gap-3 sticky top-0 z-10">
            <div class="flex items-center gap-3">
              <button type="button" id="btn-open-sb" class="md:hidden p-2 rounded-lg bg-surface-800 text-slate-300"><i data-lucide="menu" class="w-4 h-4"></i></button>
              <h2 class="text-lg font-bold text-white flex items-center gap-2"><i data-lucide="crown" class="w-5 h-5 text-emerald-400"></i> Chess Arena</h2>
            </div>
            <div class="flex items-center gap-2">

              ${activeGame ? `<button type="button" data-ctab="online" class="ctab-btn px-3 py-1.5 rounded-xl text-xs font-medium ${state.chessTab === 'online' ? 'bg-emerald-600 text-white' : 'bg-surface-800 text-slate-300 hover:text-white'}">Active Match</button>` : ''}
              <button type="button" data-ctab="bot" class="ctab-btn px-3 py-1.5 rounded-xl text-xs font-medium ${state.chessTab === 'bot' ? 'bg-indigo-600 text-white' : 'bg-surface-800 text-slate-300 hover:text-white'}">vs Bot</button>
              <button type="button" id="btn-back-chat" class="px-3 py-1.5 rounded-xl bg-surface-800 hover:bg-surface-700 text-xs text-slate-200">Chat</button>
            </div>
          </header>
          <div class="p-4 sm:p-6 max-w-5xl w-full mx-auto">${content}</div>
        </main>`;

                  <tbody class="divide-y divide-slate-800/70">
                    ${users.map(u => {
                      const self = u.id === state.me?.id;
                      return `<tr>
                        <td class="px-4 py-3"><div class="font-medium text-white">${esc(u.name)} ${self ? '<span class="text-slate-500">(You)</span>' : ''}</div><div class="text-slate-400">${esc(u.email)}</div></td>
                        <td class="px-4 py-3"><span class="px-2 py-0.5 rounded-full ${u.role === 'admin' ? 'bg-indigo-500/20 text-indigo-300' : 'bg-slate-800 text-slate-300'}">${esc(u.role)}</span></td>

            ${state.adminTab === 'broadcast' ? `

        root.innerHTML = renderAuth();
      } else if (state.me.banned) {
        root.innerHTML = `<div class="h-full flex items-center justify-center p-6"><div class="max-w-md w-full rounded-3xl bg-surface-900 border border-rose-500/30 p-8 text-center"><h2 class="text-xl font-bold text-white">Account Suspended</h2><p class="mt-2 text-sm text-slate-400">Suspended by an administrator.</p><button type="button" id="btn-signout" class="mt-6 px-5 py-2.5 rounded-xl bg-surface-800 text-sm text-white">Sign Out</button></div></div>`;
      } else {
        let mainHtml = renderChat();
        if (state.view === 'admin' && state.me.role === 'admin') mainHtml = renderAdmin();
        else if (state.view === 'games') mainHtml = renderGames();
        root.innerHTML = `<div class="h-full flex overflow-hidden">${renderSidebar()}${mainHtml}</div>`;
      }
      bind();
      icons();
    }

    function bind() {
      document.querySelectorAll('[data-auth-tab]').forEach(b => b.addEventListener('click', () => { state.authTab = b.dataset.authTab; state.authError = ''; render(); }));
      document.getElementById('auth-form')?.addEventListener('submit', handleAuth);
      document.getElementById('toggle-pw')?.addEventListener('click', () => { state.showPw = !state.showPw; render(); });
      document.getElementById('btn-signout')?.addEventListener('click', signOut);
      document.getElementById('btn-open-sb')?.addEventListener('click', () => { state.mobileSidebar = true; render(); });
      document.getElementById('btn-close-sb')?.addEventListener('click', () => { state.mobileSidebar = false; render(); });
      document.getElementById('sb-backdrop')?.addEventListener('click', () => { state.mobileSidebar = false; render(); });
      document.getElementById('btn-games')?.addEventListener('click', () => { state.view = 'games'; state.mobileSidebar = false; loadChessGames(); });
      document.getElementById('btn-admin')?.addEventListener('click', () => { state.view = state.view === 'admin' ? 'chat' : 'admin'; state.mobileSidebar = false; loadWorkspaceData(false); });
      document.getElementById('btn-back-chat')?.addEventListener('click', () => { state.view = 'chat'; loadRoomMessages(false); });
      document.querySelectorAll('.room-btn').forEach(b => b.addEventListener('click', () => { state.activeRoomId = b.dataset.room; state.view = 'chat'; state.editingMsgId = null; state.mobileSidebar = false; loadRoomMessages(true); }));
      document.getElementById('chat-search')?.addEventListener('input', (e) => { state.searchQuery = e.target.value; const p = e.target.selectionStart; render(); const el = document.getElementById('chat-search'); if (el) { el.focus(); el.setSelectionRange(p, p); } });
      document.getElementById('btn-dismiss-ann')?.addEventListener('click', () => { state.annDismissed = true; render(); });
      document.getElementById('composer')?.addEventListener('submit', sendMessage);
      document.getElementById('composer-input')?.addEventListener('input', (e) => { state.composerText = e.target.value; });
      document.getElementById('btn-emoji')?.addEventListener('click', () => { state.showEmoji = !state.showEmoji; render(); });
      document.querySelectorAll('.em-btn').forEach(b => b.addEventListener('click', () => { state.composerText += b.dataset.em; state.showEmoji = false; render(); document.getElementById('composer-input')?.focus(); }));
      document.querySelectorAll('.btn-edit').forEach(b => b.addEventListener('click', () => { state.editingMsgId = b.dataset.editId; state.editingText = b.dataset.editText; render(); document.getElementById('edit-input')?.focus(); }));
      document.querySelectorAll('.btn-del').forEach(b => b.addEventListener('click', () => deleteMessage(b.dataset.delId)));
      const edIn = document.getElementById('edit-input');
      if (edIn) {
        edIn.addEventListener('input', (e) => { state.editingText = e.target.value; });
        edIn.addEventListener('keydown', (e) => { if (e.key === 'Escape') { state.editingMsgId = null; render(); } if (e.key === 'Enter') saveEdit(state.editingMsgId); });
      }
      document.querySelectorAll('.btn-save-edit').forEach(b => b.addEventListener('click', () => saveEdit(b.dataset.save)));
      document.getElementById('btn-cancel-edit')?.addEventListener('click', () => { state.editingMsgId = null; render(); });

      // Chess bindings
      document.querySelectorAll('.ctab-btn').forEach(b => b.addEventListener('click', () => { state.chessTab = b.dataset.ctab; state.selectedSquare = null; state.legalTargets = []; render(); }));
      document.getElementById('btn-new-online-chess')?.addEventListener('click', createOnlineChessGame);
      document.getElementById('btn-refresh-chess')?.addEventListener('click', loadChessGames);
      document.getElementById('btn-play-bot')?.addEventListener('click', () => { state.chessTab = 'bot'; state.selectedSquare = null; state.legalTargets = []; render(); });
      document.getElementById('btn-play-bot-card')?.addEventListener('click', () => { state.chessTab = 'bot'; state.selectedSquare = null; state.legalTargets = []; render(); });
      document.querySelectorAll('.join-game-btn').forEach(b => b.addEventListener('click', () => joinOnlineChessGame(b.dataset.joinGame)));
      document.querySelectorAll('.del-game-btn').forEach(b => b.addEventListener('click', () => deleteOnlineChessGame(b.dataset.delGame)));
      document.querySelectorAll('.chess-sq').forEach(b => b.addEventListener('click', () => handleSquareClick(b.dataset.sq)));
      document.getElementById('btn-flip-board')?.addEventListener('click', () => { state.boardFlipped = !state.boardFlipped; render(); });
      document.getElementById('btn-mute-chess')?.addEventListener('click', () => { state.chessMuted = !state.chessMuted; render(); });
      document.getElementById('btn-back-lobby')?.addEventListener('click', () => { state.chessTab = 'lobby'; state.selectedSquare = null; state.legalTargets = []; loadChessGames(); });
      document.getElementById('btn-resign-chess')?.addEventListener('click', () => { const g = getActiveOnlineGame(); if (g) resignOnlineChessGame(g); });
      document.getElementById('btn-bot-undo')?.addEventListener('click', undoBotMove);
      document.getElementById('btn-bot-new')?.addEventListener('click', resetBotGame);
      document.getElementById('bot-diff')?.addEventListener('change', (e) => { state.botDifficulty = e.target.value; });

      // Admin bindings
      document.querySelectorAll('.atab-btn').forEach(b => b.addEventListener('click', () => { state.adminTab = b.dataset.atab; render(); }));
      document.getElementById('admin-u-search')?.addEventListener('input', (e) => { state.adminUserSearch = e.target.value; const p = e.target.selectionStart; render(); const el = document.getElementById('admin-u-search'); if (el) { el.focus(); el.setSelectionRange(p, p); } });
      document.getElementById('admin-m-search')?.addEventListener('input', (e) => { state.adminMsgSearch = e.target.value; const p = e.target.selectionStart; render(); const el = document.getElementById('admin-m-search'); if (el) { el.focus(); el.setSelectionRange(p, p); } });
      document.querySelectorAll('.uact-btn').forEach(b => b.addEventListener('click', () => {
        const u = state.users.find(x => x.id === b.dataset.uid);
        if (!u) return;
        if (b.dataset.uact === 'role') adminUpdateUser(u.id, { role: u.role === 'admin' ? 'member' : 'admin' }, `${u.name} role updated`);
        if (b.dataset.uact === 'mute') adminUpdateUser(u.id, { muted: !u.muted }, `${u.name} ${!u.muted ? 'muted' : 'unmuted'}`);
        if (b.dataset.uact === 'ban') adminUpdateUser(u.id, { banned: !u.banned }, `${u.name} ${!u.banned ? 'banned' : 'unbanned'}`);
      }));
      document.getElementById('admin-ch-form')?.addEventListener('submit', adminCreateRoom);
      document.querySelectorAll('.del-room-btn').forEach(b => b.addEventListener('click', () => adminDeleteRoom(b.dataset.delRoom)));
      document.getElementById('admin-ann-form')?.addEventListener('submit', adminBroadcast);
    }

    function onSignedIn(user) {
      const sameUser = state.sessionUser && state.sessionUser.id === user.id;
      state.sessionUser = user;
      if (sameUser && state.me) return; // Prevent background token refresh from resetting views
      if (!state.me) {
        state.me = {
          id: user.id,
          name: user.user_metadata?.name || (user.email || 'User').split('@')[0],
          email: user.email || '',
          role: 'member',
          muted: false,
          banned: false,
          color: '#6366f1',
        };
      }
      render();
      setTimeout(() => {
        setupRealtime();
        loadWorkspaceData(true);
      }, 0);
    }

    sb.auth.onAuthStateChange((_event, session) => {
      if (session?.user) {
        onSignedIn(session.user);
      } else {
        state.sessionUser = null;
        state.me = null;
        render();
      }
    });

    sb.auth.getSession().then(({ data }) => {
      if (data?.session?.user) onSignedIn(data.session.user);
      else render();
    });
  </script>
</body>
</html>
