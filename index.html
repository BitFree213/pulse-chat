<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseChat — Live Online Chat &amp; Admin Workspace</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: { 950: '#090d16', 900: '#0f1624', 850: '#141d2e', 800: '#1a253a', 700: '#25334d' }
          }
        }
      }
    };
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #090d16; color: #e2e8f0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #25334d; border-radius: 9999px; }
    .msg-row:hover .msg-actions { opacity: 1; pointer-events: auto; }
    .msg-actions { opacity: 0; pointer-events: none; transition: opacity .15s ease; }
    @media (max-width: 768px) { .msg-actions { opacity: 1; pointer-events: auto; } }
    .glass-card { background: rgba(15, 22, 36, .88); backdrop-filter: blur(16px); }
  </style>
</head>
<body class="h-full antialiased">
  <div id="app" class="h-full flex flex-col"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script>
    const DEFAULT_SUPABASE_URL = 'https://afujvzkwrzhytrtjfytr.supabase.co';
    const DEFAULT_SUPABASE_KEY = 'sb_publishable_iVtmYzJh6VRNafqnZCmGFg_-FNm0I3f';
    const EMOJIS = ['😀', '🔥', '🚀', '👍', '❤️', '🎉', '👀', '💡', '✅', '🙏', '😂', '⚡'];

    function safeGet(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
    function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }

    const sbUrl = safeGet('pulsechat_sb_url') || DEFAULT_SUPABASE_URL;
    const sbKey = safeGet('pulsechat_sb_key') || DEFAULT_SUPABASE_KEY;
    let sb = window.supabase.createClient(sbUrl, sbKey);
    let rtChannel = null;

    const state = {
      authTab: 'login',
      authLoading: false,
      authError: '',
      showPw: false,
      sessionUser: null,
      me: null,
      view: 'chat',
      adminTab: 'users',
      activeRoomId: 'general',
      searchQuery: '',
      adminUserSearch: '',
      adminMsgSearch: '',
      editingMsgId: null,
      editingText: '',
      composerText: '',
      showEmoji: false,
      mobileSidebar: false,
      annDismissed: false,
      users: [],
      rooms: [],
      messages: [],
      allMessages: [],
      announcement: null,
      loadingData: false,
    };

    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function initials(n) {
      const p = String(n || 'U').trim().split(/\s+/);
      return (p[0][0] + (p[1] ? p[1][0] : '')).toUpperCase();
    }
    function fmtTime(ts) {
      if (!ts) return '';
      return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    function toast(msg, type = 'info') {
      const root = document.getElementById('toast-root');
      if (!root) return;
      const cls = {
        success: 'bg-emerald-500/15 border-emerald-500/40 text-emerald-200',
        error: 'bg-rose-500/15 border-rose-500/40 text-rose-200',
        info: 'bg-indigo-500/15 border-indigo-500/40 text-indigo-200',
      }[type] || 'bg-indigo-500/15 border-indigo-500/40 text-indigo-200';
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-2.5 rounded-xl border text-sm font-medium shadow-xl backdrop-blur-md transition ${cls}`;
      el.textContent = msg;
      root.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 220); }, 3000);
    }
    function scrollBottom() {
      setTimeout(() => { const el = document.getElementById('messages-scroll'); if (el) el.scrollTop = el.scrollHeight; }, 40);
    }
    function icons() { if (window.lucide) window.lucide.createIcons(); }

    async function loadWorkspaceData(shouldScroll = false) {
      if (!state.sessionUser) return;
      state.loadingData = true;
      try {
        const [uRes, rRes, aRes] = await Promise.all([
          sb.from('profiles').select('*').order('created_at', { ascending: true }),
          sb.from('rooms').select('*').order('created_at', { ascending: true }),
          sb.from('announcements').select('*').eq('id', 'active').maybeSingle(),
        ]);
        if (uRes.error) toast('Profile load error: ' + uRes.error.message, 'error');
        if (rRes.error) toast('Rooms load error: ' + rRes.error.message, 'error');
        if (uRes.data) {
          state.users = uRes.data;
          state.me = state.users.find(u => u.id === state.sessionUser.id) || state.me;
        }
        if (!state.me && state.sessionUser) {
          state.me = {
            id: state.sessionUser.id,
            name: state.sessionUser.user_metadata?.name || (state.sessionUser.email || 'User').split('@')[0],
            email: state.sessionUser.email || '',
            role: state.users.length === 0 ? 'admin' : 'member',
            muted: false,
            banned: false,
            color: '#6366f1',
          };
        }
        if (rRes.data) {
          state.rooms = rRes.data;
          if (!state.rooms.find(r => r.id === state.activeRoomId) && state.rooms.length) {
            state.activeRoomId = state.rooms[0].id;
          }
        }
        state.announcement = aRes.data && aRes.data.text ? aRes.data : null;
        await loadRoomMessages(shouldScroll);
        if (state.me?.role === 'admin' && state.view === 'admin') {
          const allRes = await sb.from('messages').select('*').order('created_at', { ascending: false }).limit(200);
          if (allRes.data) state.allMessages = allRes.data;
        }
      } catch (err) {
        toast('Sync error: ' + err.message, 'error');
      } finally {
        state.loadingData = false;
        render();
      }
    }

    async function loadRoomMessages(shouldScroll = false) {
      if (!state.activeRoomId) return;
      const { data } = await sb.from('messages').select('*').eq('room_id', state.activeRoomId).order('created_at', { ascending: true });
      if (data) state.messages = data;
      render();
      if (shouldScroll) scrollBottom();
    }

    function setupRealtime() {
      if (rtChannel) { try { sb.removeChannel(rtChannel); } catch (_) {} }
      rtChannel = sb.channel('pulse-live')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => loadWorkspaceData(true))
        .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms' }, () => loadWorkspaceData(false))
        .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => loadWorkspaceData(false))
        .on('postgres_changes', { event: '*', schema: 'public', table: 'announcements' }, () => { state.annDismissed = false; loadWorkspaceData(false); })
        .subscribe();
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = (e.target.email?.value || '').trim().toLowerCase();
      const password = e.target.password?.value || '';
      const name = (e.target.displayName?.value || '').trim();
      if (!email || password.length < 6) {
        state.authError = 'Enter a valid email and a password of at least 6 characters.';
        render();
        return;
      }
      state.authError = '';
      state.authLoading = true;
      render();
      try {
        if (state.authTab === 'signup') {
          const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name: name || email.split('@')[0] } } });
          if (error) throw error;
          if (!data.session) {
            toast('Account created! Please sign in.', 'success');
            state.authTab = 'login';
          } else {
            toast('Welcome to PulseChat!', 'success');
          }
        } else {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
          toast('Signed in!', 'success');
        }
      } catch (err) {
        state.authError = err.message || 'Authentication failed';
      } finally {
        state.authLoading = false;
        render();
      }
    }

    async function signOut() {
      if (rtChannel) { try { sb.removeChannel(rtChannel); } catch (_) {} rtChannel = null; }
      await sb.auth.signOut();
      state.sessionUser = null;
      state.me = null;
      state.view = 'chat';
      toast('Signed out', 'info');
      render();
    }

    async function sendMessage(e) {
      e.preventDefault();
      const text = state.composerText.trim();
      if (!text || !state.me) return;
      if (state.me.muted) return toast('You are muted by an admin.', 'error');
      state.composerText = '';
      state.showEmoji = false;
      render();
      const { error } = await sb.from('messages').insert({
        room_id: state.activeRoomId,
        uid: state.me.id,
        author_name: state.me.name,
        author_role: state.me.role,
        author_color: state.me.color || '#6366f1',
        text,
      });
      if (error) toast('Failed to send: ' + error.message, 'error');
      else await loadRoomMessages(true);
    }

    async function saveEdit(msgId) {
      const text = state.editingText.trim();
      if (!text) return toast('Message cannot be empty.', 'error');
      const { error } = await sb.from('messages').update({ text, edited: true, edited_at: new Date().toISOString() }).eq('id', msgId);
      if (error) toast('Edit failed: ' + error.message, 'error');
      else toast('Message updated', 'success');
      state.editingMsgId = null;
      state.editingText = '';
      await loadRoomMessages(false);
    }

    function openConfirm(title, body, label, onConfirm) {
      document.getElementById('modal-root').innerHTML = `
        <div id="m-bg" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
          <div class="w-full max-w-md rounded-2xl bg-surface-900 border border-slate-700/70 p-6 shadow-2xl">
            <h3 class="text-lg font-semibold text-white">${esc(title)}</h3>
            <p class="mt-2 text-sm text-slate-400">${esc(body)}</p>
            <div class="mt-6 flex justify-end gap-2">
              <button type="button" id="m-no" class="px-4 py-2 rounded-xl text-sm bg-surface-800 hover:bg-surface-700 text-slate-200">Cancel</button>
              <button type="button" id="m-yes" class="px-4 py-2 rounded-xl text-sm bg-rose-600 hover:bg-rose-500 text-white font-medium">${esc(label)}</button>
            </div>
          </div>
        </div>`;
      const close = () => { document.getElementById('modal-root').innerHTML = ''; };
      document.getElementById('m-no').addEventListener('click', close);
      document.getElementById('m-bg').addEventListener('click', (e) => { if (e.target.id === 'm-bg') close(); });
      document.getElementById('m-yes').addEventListener('click', async () => { close(); await onConfirm(); });
    }

    async function deleteMessage(msgId) {
      openConfirm('Delete Message', 'Permanently delete this message?', 'Delete', async () => {
        const { error } = await sb.from('messages').delete().eq('id', msgId);
        if (error) toast('Delete failed: ' + error.message, 'error');
        else { toast('Message deleted', 'info'); await loadWorkspaceData(false); }
      });
    }

    async function adminUpdateUser(uid, updates, msg) {
      if (uid === state.me?.id) return toast('Cannot modify your own admin status.', 'error');
      const { error } = await sb.from('profiles').update(updates).eq('id', uid);
      if (error) toast('Update failed: ' + error.message, 'error');
      else { toast(msg, 'success'); await loadWorkspaceData(false); }
    }

    async function adminCreateRoom(e) {
      e.preventDefault();
      const slug = (e.target.channelName?.value || '').trim().toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-|-$/g, '');
      const description = (e.target.channelDesc?.value || '').trim() || 'Discussion channel';
      if (!slug) return toast('Enter a valid channel name.', 'error');
      const { error } = await sb.from('rooms').insert({ id: slug, name: slug, description });
      if (error) toast('Failed: ' + error.message, 'error');
      else { toast(`Created #${slug}`, 'success'); e.target.reset(); await loadWorkspaceData(false); }
    }

    function adminDeleteRoom(roomId) {
      if (roomId === 'general') return toast('Cannot delete #general.', 'error');
      openConfirm(`Delete #${roomId}`, 'This removes the channel and its messages.', 'Delete Channel', async () => {
        const { error } = await sb.from('rooms').delete().eq('id', roomId);
        if (error) toast('Delete failed: ' + error.message, 'error');
        else {
          if (state.activeRoomId === roomId) state.activeRoomId = 'general';
          toast(`Deleted #${roomId}`, 'info');
          await loadWorkspaceData(false);
        }
      });
    }

    async function adminBroadcast(e) {
      e.preventDefault();
      const text = (e.target.announcementText?.value || '').trim();
      const { error } = await sb.from('announcements').upsert({ id: 'active', text, author_name: state.me.name, updated_at: new Date().toISOString() });
      if (error) toast('Failed: ' + error.message, 'error');
      else { toast(text ? 'Announcement published' : 'Announcement cleared', 'success'); state.annDismissed = false; await loadWorkspaceData(false); }
    }

    function renderAuth() {
      const isSignup = state.authTab === 'signup';
      return `
        <div class="min-h-full flex flex-col bg-surface-950 relative overflow-hidden">
          <div class="absolute inset-0 pointer-events-none">
            <div class="absolute -top-32 -left-24 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
            <div class="absolute bottom-0 right-0 w-96 h-96 bg-emerald-600/10 rounded-full blur-3xl"></div>
          </div>
          <header class="relative z-10 flex items-center justify-between px-6 py-4 border-b border-slate-800/60">
            <div class="flex items-center gap-2.5">
              <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                <i data-lucide="message-square-code" class="w-5 h-5 text-white"></i>
              </div>
              <span class="font-bold text-lg text-white">PulseChat</span>
            </div>
            <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/15 border border-emerald-500/30 text-emerald-300">
              <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Live Cloud Backend
            </span>
          </header>
          <main class="relative z-10 flex-1 flex items-center justify-center p-4">
            <div class="w-full max-w-md glass-card border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl">
              <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-white">${isSignup ? 'Create your account' : 'Welcome back'}</h1>
                <p class="text-sm text-slate-400 mt-1">${isSignup ? 'First registered user automatically becomes Admin' : 'Sign in with your email and password'}</p>
              </div>
              <div class="grid grid-cols-2 p-1 rounded-xl bg-surface-950 border border-slate-800 mb-6">
                <button type="button" data-auth-tab="login" class="py-2 rounded-lg text-sm font-medium ${!isSignup ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}">Sign In</button>
                <button type="button" data-auth-tab="signup" class="py-2 rounded-lg text-sm font-medium ${isSignup ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}">Create Account</button>
              </div>
              ${state.authError ? `<div class="mb-4 px-3.5 py-2.5 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-200 text-xs">${esc(state.authError)}</div>` : ''}
              <form id="auth-form" class="space-y-4">
                ${isSignup ? `<div><label class="block text-xs font-medium text-slate-300 mb-1.5">Display Name</label><input name="displayName" type="text" required placeholder="Your name" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-950 border border-slate-700/80 text-sm text-white focus:outline-none focus:border-indigo-500" /></div>` : ''}
                <div><label class="block text-xs font-medium text-slate-300 mb-1.5">Email Address</label><input name="email" type="email" required placeholder="you@example.com" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-950 border border-slate-700/80 text-sm text-white focus:outline-none focus:border-indigo-500" /></div>
                <div>
                  <label class="block text-xs font-medium text-slate-300 mb-1.5">Password</label>
                  <div class="relative">
                    <input name="password" type="${state.showPw ? 'text' : 'password'}" required minlength="6" placeholder="Minimum 6 characters" class="w-full pl-3.5 pr-10 py-2.5 rounded-xl bg-surface-950 border border-slate-700/80 text-sm text-white focus:outline-none focus:border-indigo-500" />
                    <button type="button" id="toggle-pw" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white"><i data-lucide="${state.showPw ? 'eye-off' : 'eye'}" class="w-4 h-4"></i></button>
                  </div>
                </div>
                <button type="submit" ${state.authLoading ? 'disabled' : ''} class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-60 text-white font-semibold text-sm transition">${state.authLoading ? 'Connecting...' : (isSignup ? 'Create Account' : 'Sign In')}</button>
              </form>
            </div>
          </main>
        </div>`;
    }

    function renderSidebar() {
      const isAdmin = state.me?.role === 'admin';
      const activeUsers = state.users.filter(u => !u.banned);
      return `
        <aside class="${state.mobileSidebar ? 'fixed inset-y-0 left-0 z-40 flex' : 'hidden md:flex'} w-64 shrink-0 flex-col bg-surface-900 border-r border-slate-800/80 h-full">
          <div class="px-4 py-3.5 border-b border-slate-800/80 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center"><i data-lucide="message-square-code" class="w-4 h-4 text-white"></i></div>
              <div>
                <div class="font-bold text-sm text-white">PulseChat</div>
                <div class="text-[11px] text-emerald-400 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Live Realtime</div>
              </div>
            </div>
            <button type="button" id="btn-close-sb" class="md:hidden p-1.5 rounded-lg text-slate-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          <div class="flex-1 overflow-y-auto px-3 py-4 space-y-6">
            ${isAdmin ? `<button type="button" id="btn-admin" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium ${state.view === 'admin' ? 'bg-indigo-600 text-white' : 'bg-indigo-500/10 text-indigo-300 hover:bg-indigo-500/20 border border-indigo-500/20'}"><span class="flex items-center gap-2"><i data-lucide="shield-check" class="w-4 h-4"></i> Admin Panel</span><span class="text-[10px] uppercase px-1.5 py-0.5 rounded bg-black/20">${state.view === 'admin' ? 'Active' : 'Open'}</span></button>` : ''}
            <div>
              <div class="px-2 mb-2 text-[11px] font-semibold uppercase tracking-wider text-slate-500">Channels (${state.rooms.length})</div>
              <div class="space-y-0.5">
                ${state.rooms.map(r => `<button type="button" data-room="${esc(r.id)}" class="room-btn w-full flex items-center gap-2 px-3 py-2 rounded-xl text-sm ${state.view === 'chat' && state.activeRoomId === r.id ? 'bg-surface-800 text-white font-medium' : 'text-slate-400 hover:text-white hover:bg-surface-850'}"><span class="text-slate-500">#</span><span class="truncate">${esc(r.name)}</span></button>`).join('')}
              </div>
            </div>
            <div>
              <div class="px-2 mb-2 text-[11px] font-semibold uppercase tracking-wider text-slate-500">Members (${activeUsers.length})</div>
              <div class="space-y-1">
                ${activeUsers.map(u => `
                  <div class="flex items-center gap-2.5 px-2 py-1.5">
                    <div class="w-7 h-7 rounded-full flex items-center justify-center text-[11px] font-bold text-white shrink-0" style="background:${esc(u.color || '#6366f1')}">${esc(initials(u.name))}</div>
                    <div class="min-w-0 flex-1">
                      <div class="flex items-center gap-1.5"><span class="text-xs font-medium text-slate-200 truncate">${esc(u.name)}</span>${u.role === 'admin' ? '<span class="text-[9px] font-semibold px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-300">ADMIN</span>' : ''}</div>
                      ${u.muted ? '<div class="text-[10px] text-amber-400">Muted</div>' : ''}
                    </div>
                  </div>`).join('')}
              </div>
            </div>
          </div>
          <div class="p-3 border-t border-slate-800/80 bg-surface-950/50 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2.5 min-w-0">
              <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold text-white shrink-0" style="background:${esc(state.me?.color || '#6366f1')}">${esc(initials(state.me?.name))}</div>
              <div class="min-w-0"><div class="text-xs font-semibold text-white truncate">${esc(state.me?.name)}</div><div class="text-[11px] text-slate-400 capitalize">${esc(state.me?.role)}</div></div>
            </div>
            <button type="button" id="btn-signout" title="Sign Out" class="p-2 rounded-lg text-slate-400 hover:text-rose-300 hover:bg-rose-500/10"><i data-lucide="log-out" class="w-4 h-4"></i></button>
          </div>
        </aside>
        ${state.mobileSidebar ? '<div id="sb-backdrop" class="fixed inset-0 z-30 bg-black/60 md:hidden"></div>' : ''}`;
    }

    function renderChat() {
      const room = state.rooms.find(r => r.id === state.activeRoomId) || { id: 'general', name: 'general', description: '' };
      const q = state.searchQuery.trim().toLowerCase();
      const msgs = q ? state.messages.filter(m => m.text.toLowerCase().includes(q) || m.author_name.toLowerCase().includes(q)) : state.messages;
      const isAdmin = state.me?.role === 'admin';
      return `
        <main class="flex-1 flex flex-col min-w-0 h-full bg-surface-950">
          <header class="px-4 sm:px-6 py-3.5 border-b border-slate-800/80 bg-surface-900/70 backdrop-blur-md flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
              <button type="button" id="btn-open-sb" class="md:hidden p-2 rounded-lg bg-surface-800 text-slate-300"><i data-lucide="menu" class="w-4 h-4"></i></button>
              <div class="min-w-0">
                <div class="flex items-center gap-2"><span class="text-indigo-400 font-bold">#</span><h2 class="font-semibold text-white truncate">${esc(room.name)}</h2></div>
                <p class="text-xs text-slate-400 truncate">${esc(room.description)}</p>
              </div>
            </div>
            <div class="relative hidden sm:block">
              <i data-lucide="search" class="w-3.5 h-3.5 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2"></i>
              <input id="chat-search" type="text" value="${esc(state.searchQuery)}" placeholder="Search messages..." class="w-48 pl-8 pr-3 py-1.5 rounded-xl bg-surface-950 border border-slate-800 text-xs text-slate-200 focus:outline-none focus:border-indigo-500" />
            </div>
          </header>
          ${state.announcement && !state.annDismissed ? `
            <div class="px-4 sm:px-6 py-2.5 bg-indigo-600/15 border-b border-indigo-500/25 flex items-center justify-between gap-3">
              <div class="flex items-center gap-2 text-xs text-indigo-200 min-w-0"><i data-lucide="megaphone" class="w-4 h-4 text-indigo-400 shrink-0"></i><span class="truncate"><strong class="text-white">Announcement:</strong> ${esc(state.announcement.text)}</span></div>
              <button type="button" id="btn-dismiss-ann" class="text-indigo-300 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>` : ''}
          <div id="messages-scroll" class="flex-1 overflow-y-auto px-4 sm:px-6 py-5 space-y-3">
            ${msgs.length === 0 ? `<div class="h-full flex flex-col items-center justify-center text-center py-12"><i data-lucide="message-circle" class="w-8 h-8 text-slate-600 mb-2"></i><p class="text-sm text-slate-400">No messages in #${esc(room.name)} yet.</p></div>` : msgs.map(m => {
              const isOwn = m.uid === state.me?.id;
              const canEdit = isOwn || isAdmin;
              const isEd = state.editingMsgId === m.id;
              return `
                <div class="msg-row group flex items-start gap-3 p-2.5 -mx-2.5 rounded-2xl hover:bg-surface-900/70 transition">
                  <div class="w-9 h-9 rounded-full flex items-center justify-center text-xs font-bold text-white shrink-0" style="background:${esc(m.author_color || '#6366f1')}">${esc(initials(m.author_name))}</div>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center flex-wrap gap-2">
                      <span class="text-sm font-semibold ${isOwn ? 'text-indigo-300' : 'text-white'}">${esc(m.author_name)}</span>
                      ${m.author_role === 'admin' ? '<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-300">ADMIN</span>' : ''}
                      <span class="text-[11px] text-slate-500">${fmtTime(m.created_at)}</span>
                      ${m.edited ? `<span title="Edited at ${fmtTime(m.edited_at)}" class="text-[11px] text-slate-500 italic">(edited)</span>` : ''}
                    </div>
                    ${isEd ? `
                      <div class="mt-2 space-y-2">
                        <input id="edit-input" type="text" value="${esc(state.editingText)}" class="w-full px-3.5 py-2 rounded-xl bg-surface-950 border border-indigo-500 text-sm text-white focus:outline-none" />
                        <div class="flex items-center gap-2">
                          <button type="button" data-save="${esc(m.id)}" class="btn-save-edit px-3 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-xs font-medium text-white">Save</button>
                          <button type="button" id="btn-cancel-edit" class="px-3 py-1 rounded-lg bg-surface-800 hover:bg-surface-700 text-xs text-slate-300">Cancel</button>
                        </div>
                      </div>` : `<p class="mt-1 text-sm text-slate-200 leading-relaxed break-words whitespace-pre-wrap">${esc(m.text)}</p>`}
                  </div>
                  ${canEdit && !isEd ? `
                    <div class="msg-actions flex items-center gap-1 shrink-0 bg-surface-900 border border-slate-800 rounded-xl p-1">
                      <button type="button" data-edit-id="${esc(m.id)}" data-edit-text="${esc(m.text)}" title="Edit" class="btn-edit p-1.5 rounded-lg text-slate-400 hover:text-indigo-300 hover:bg-surface-800"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
                      <button type="button" data-del-id="${esc(m.id)}" title="Delete" class="btn-del p-1.5 rounded-lg text-slate-400 hover:text-rose-400 hover:bg-rose-500/10"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                    </div>` : ''}
                </div>`;
            }).join('')}
          </div>
          <div class="px-4 sm:px-6 py-4 border-t border-slate-800/80 bg-surface-900/50 relative">
            ${state.showEmoji ? `<div class="absolute bottom-20 left-6 z-20 p-2 rounded-2xl bg-surface-900 border border-slate-700 shadow-2xl flex flex-wrap gap-1 max-w-xs">${EMOJIS.map(em => `<button type="button" data-em="${em}" class="em-btn w-8 h-8 rounded-lg hover:bg-surface-800 text-lg">${em}</button>`).join('')}</div>` : ''}
            ${state.me?.muted ? `<div class="px-4 py-3 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs">You are currently muted by an administrator.</div>` : `
              <form id="composer" class="flex items-center gap-2 bg-surface-950 border border-slate-800 focus-within:border-indigo-500/80 rounded-2xl px-3 py-2">
                <button type="button" id="btn-emoji" class="p-2 rounded-xl text-slate-400 hover:text-amber-300 hover:bg-surface-800"><i data-lucide="smile" class="w-5 h-5"></i></button>
                <input id="composer-input" type="text" autocomplete="off" value="${esc(state.composerText)}" placeholder="Message #${esc(room.name)}..." class="flex-1 bg-transparent text-sm text-white placeholder-slate-500 focus:outline-none min-w-0" />
                <button type="submit" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium flex items-center gap-1.5"><span>Send</span><i data-lucide="send" class="w-3.5 h-3.5"></i></button>
              </form>`}
          </div>
        </main>`;
    }

    function renderAdmin() {
      const restricted = state.users.filter(u => u.muted || u.banned).length;
      const uq = state.adminUserSearch.trim().toLowerCase();
      const users = uq ? state.users.filter(u => u.name.toLowerCase().includes(uq) || u.email.toLowerCase().includes(uq)) : state.users;
      const mq = state.adminMsgSearch.trim().toLowerCase();
      const msgs = mq ? state.allMessages.filter(m => m.text.toLowerCase().includes(mq) || m.author_name.toLowerCase().includes(mq) || m.room_id.toLowerCase().includes(mq)) : state.allMessages;
      const tabs = [['users', 'Users & Roles', 'users'], ['channels', 'Channels', 'hash'], ['moderation', 'Messages', 'message-square-warning'], ['broadcast', 'Broadcast', 'megaphone']];
      return `
        <main class="flex-1 flex flex-col min-w-0 h-full bg-surface-950 overflow-y-auto">
          <header class="px-4 sm:px-6 py-4 border-b border-slate-800/80 bg-surface-900/70 backdrop-blur-md flex items-center justify-between sticky top-0 z-10">
            <div class="flex items-center gap-3">
              <button type="button" id="btn-open-sb" class="md:hidden p-2 rounded-lg bg-surface-800 text-slate-300"><i data-lucide="menu" class="w-4 h-4"></i></button>
              <h2 class="text-lg font-bold text-white flex items-center gap-2"><i data-lucide="shield-check" class="w-5 h-5 text-indigo-400"></i> Admin Panel</h2>
            </div>
            <button type="button" id="btn-back-chat" class="px-3.5 py-2 rounded-xl bg-surface-800 hover:bg-surface-700 text-xs font-medium text-slate-200">Back to Chat</button>
          </header>
          <div class="p-4 sm:p-6 max-w-5xl w-full mx-auto space-y-6">
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
              <div class="rounded-2xl bg-surface-900 border border-slate-800 p-4"><div class="text-xs text-slate-400">Users</div><div class="mt-1 text-2xl font-bold text-white">${state.users.length}</div></div>
              <div class="rounded-2xl bg-surface-900 border border-slate-800 p-4"><div class="text-xs text-slate-400">Channels</div><div class="mt-1 text-2xl font-bold text-indigo-400">${state.rooms.length}</div></div>
              <div class="rounded-2xl bg-surface-900 border border-slate-800 p-4"><div class="text-xs text-slate-400">Recent Messages</div><div class="mt-1 text-2xl font-bold text-emerald-400">${state.allMessages.length}</div></div>
              <div class="rounded-2xl bg-surface-900 border border-slate-800 p-4"><div class="text-xs text-slate-400">Muted / Banned</div><div class="mt-1 text-2xl font-bold text-amber-400">${restricted}</div></div>
            </div>
            <div class="flex flex-wrap gap-2 border-b border-slate-800 pb-3">
              ${tabs.map(([id, label, icon]) => `<button type="button" data-atab="${id}" class="atab-btn inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-medium ${state.adminTab === id ? 'bg-indigo-600 text-white' : 'bg-surface-900 text-slate-400 hover:text-white border border-slate-800'}"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i> ${label}</button>`).join('')}
            </div>
            ${state.adminTab === 'users' ? `
              <div class="rounded-2xl bg-surface-900 border border-slate-800 overflow-hidden">
                <div class="p-4 border-b border-slate-800 flex flex-wrap justify-between gap-3"><h3 class="text-sm font-semibold text-white">Users</h3><input id="admin-u-search" type="text" value="${esc(state.adminUserSearch)}" placeholder="Filter users..." class="px-3 py-1.5 rounded-xl bg-surface-950 border border-slate-800 text-xs text-slate-200 w-full sm:w-60" /></div>
                <div class="overflow-x-auto"><table class="w-full text-left text-xs">
                  <thead class="bg-surface-950/60 text-slate-400 uppercase text-[10px]"><tr><th class="px-4 py-3">User</th><th class="px-4 py-3">Role</th><th class="px-4 py-3">Status</th><th class="px-4 py-3 text-right">Actions</th></tr></thead>
                  <tbody class="divide-y divide-slate-800/70">
                    ${users.map(u => {
                      const self = u.id === state.me?.id;
                      return `<tr>
                        <td class="px-4 py-3"><div class="font-medium text-white">${esc(u.name)} ${self ? '<span class="text-slate-500">(You)</span>' : ''}</div><div class="text-slate-400">${esc(u.email)}</div></td>
                        <td class="px-4 py-3"><span class="px-2 py-0.5 rounded-full ${u.role === 'admin' ? 'bg-indigo-500/20 text-indigo-300' : 'bg-slate-800 text-slate-300'}">${esc(u.role)}</span></td>
                        <td class="px-4 py-3">${u.banned ? '<span class="px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-300">Banned</span>' : (u.muted ? '<span class="px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300">Muted</span>' : '<span class="px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-300">Active</span>')}</td>
                        <td class="px-4 py-3 text-right">${self ? '<span class="text-slate-500">Protected</span>' : `
                          <div class="inline-flex gap-1.5">
                            <button type="button" data-uact="role" data-uid="${esc(u.id)}" class="uact-btn px-2.5 py-1 rounded-lg bg-surface-800 hover:bg-surface-700 text-slate-200">${u.role === 'admin' ? 'Demote' : 'Make Admin'}</button>
                            <button type="button" data-uact="mute" data-uid="${esc(u.id)}" class="uact-btn px-2.5 py-1 rounded-lg bg-amber-500/15 text-amber-300">${u.muted ? 'Unmute' : 'Mute'}</button>
                            <button type="button" data-uact="ban" data-uid="${esc(u.id)}" class="uact-btn px-2.5 py-1 rounded-lg bg-rose-500/15 text-rose-300">${u.banned ? 'Unban' : 'Ban'}</button>
                          </div>`}</td>
                      </tr>`;
                    }).join('')}
                  </tbody>
                </table></div>
              </div>` : ''}
            ${state.adminTab === 'channels' ? `
              <div class="grid md:grid-cols-2 gap-4">
                <div class="rounded-2xl bg-surface-900 border border-slate-800 p-5">
                  <h3 class="text-sm font-semibold text-white mb-4">Create Channel</h3>
                  <form id="admin-ch-form" class="space-y-3">
                    <input name="channelName" type="text" required placeholder="Channel name (e.g. updates)" class="w-full px-3 py-2 rounded-xl bg-surface-950 border border-slate-800 text-sm text-white" />
                    <input name="channelDesc" type="text" placeholder="Topic description" class="w-full px-3 py-2 rounded-xl bg-surface-950 border border-slate-800 text-sm text-white" />
                    <button type="submit" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold text-white">Create Channel</button>
                  </form>
                </div>
                <div class="rounded-2xl bg-surface-900 border border-slate-800 p-5 space-y-2">
                  <h3 class="text-sm font-semibold text-white mb-3">Existing Channels</h3>
                  ${state.rooms.map(r => `<div class="flex items-center justify-between p-3 rounded-xl bg-surface-950 border border-slate-800"><div class="min-w-0"><div class="text-sm font-medium text-white">#${esc(r.name)}</div><div class="text-xs text-slate-400 truncate">${esc(r.description)}</div></div>${r.id === 'general' ? '<span class="text-[11px] text-slate-500">Default</span>' : `<button type="button" data-del-room="${esc(r.id)}" class="del-room-btn px-2.5 py-1 rounded-lg bg-rose-500/15 text-rose-300 text-xs">Delete</button>`}</div>`).join('')}
                </div>
              </div>` : ''}
            ${state.adminTab === 'moderation' ? `
              <div class="rounded-2xl bg-surface-900 border border-slate-800 overflow-hidden">
                <div class="p-4 border-b border-slate-800 flex flex-wrap justify-between gap-3"><h3 class="text-sm font-semibold text-white">Message Moderation</h3><input id="admin-m-search" type="text" value="${esc(state.adminMsgSearch)}" placeholder="Search messages..." class="px-3 py-1.5 rounded-xl bg-surface-950 border border-slate-800 text-xs text-slate-200 w-full sm:w-60" /></div>
                <div class="divide-y divide-slate-800/70 max-h-96 overflow-y-auto">
                  ${msgs.length === 0 ? '<div class="p-6 text-center text-xs text-slate-500">No messages.</div>' : msgs.map(m => `
                    <div class="p-4 flex items-start justify-between gap-4">
                      <div class="min-w-0">
                        <div class="flex items-center gap-2 text-xs"><span class="font-semibold text-white">${esc(m.author_name)}</span><span class="px-1.5 py-0.5 rounded bg-surface-800 text-indigo-300 text-[10px]">#${esc(m.room_id)}</span><span class="text-slate-500">${fmtTime(m.created_at)}</span></div>
                        <p class="mt-1 text-sm text-slate-300 break-words">${esc(m.text)}</p>
                      </div>
                      <button type="button" data-del-id="${esc(m.id)}" class="btn-del shrink-0 px-2.5 py-1.5 rounded-lg bg-rose-500/15 text-rose-300 text-xs">Delete</button>
                    </div>`).join('')}
                </div>
              </div>` : ''}
            ${state.adminTab === 'broadcast' ? `
              <div class="rounded-2xl bg-surface-900 border border-slate-800 p-5">
                <h3 class="text-sm font-semibold text-white mb-2">Global Announcement Banner</h3>
                <form id="admin-ann-form" class="space-y-3">
                  <textarea name="announcementText" rows="3" placeholder="Broadcast a message to all channels (leave empty to clear)..." class="w-full px-3.5 py-2.5 rounded-xl bg-surface-950 border border-slate-800 text-sm text-white">${esc(state.announcement?.text || '')}</textarea>
                  <button type="submit" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold text-white">Save Announcement</button>
                </form>
              </div>` : ''}
          </div>
        </main>`;
    }

    function render() {
      const root = document.getElementById('app');
      if (!state.sessionUser || !state.me) {
        root.innerHTML = renderAuth();
      } else if (state.me.banned) {
        root.innerHTML = `<div class="h-full flex items-center justify-center p-6"><div class="max-w-md w-full rounded-3xl bg-surface-900 border border-rose-500/30 p-8 text-center"><h2 class="text-xl font-bold text-white">Account Suspended</h2><p class="mt-2 text-sm text-slate-400">Suspended by an administrator.</p><button type="button" id="btn-signout" class="mt-6 px-5 py-2.5 rounded-xl bg-surface-800 text-sm text-white">Sign Out</button></div></div>`;
      } else {
        root.innerHTML = `<div class="h-full flex overflow-hidden">${renderSidebar()}${state.view === 'admin' && state.me.role === 'admin' ? renderAdmin() : renderChat()}</div>`;
      }
      bind();
      icons();
    }

    function bind() {
      document.querySelectorAll('[data-auth-tab]').forEach(b => b.addEventListener('click', () => { state.authTab = b.dataset.authTab; state.authError = ''; render(); }));
      document.getElementById('auth-form')?.addEventListener('submit', handleAuth);
      document.getElementById('toggle-pw')?.addEventListener('click', () => { state.showPw = !state.showPw; render(); });
      document.getElementById('btn-signout')?.addEventListener('click', signOut);
      document.getElementById('btn-open-sb')?.addEventListener('click', () => { state.mobileSidebar = true; render(); });
      document.getElementById('btn-close-sb')?.addEventListener('click', () => { state.mobileSidebar = false; render(); });
      document.getElementById('sb-backdrop')?.addEventListener('click', () => { state.mobileSidebar = false; render(); });
      document.getElementById('btn-admin')?.addEventListener('click', () => { state.view = state.view === 'admin' ? 'chat' : 'admin'; state.mobileSidebar = false; loadWorkspaceData(false); });
      document.getElementById('btn-back-chat')?.addEventListener('click', () => { state.view = 'chat'; render(); });
      document.querySelectorAll('.room-btn').forEach(b => b.addEventListener('click', () => { state.activeRoomId = b.dataset.room; state.view = 'chat'; state.editingMsgId = null; state.mobileSidebar = false; loadRoomMessages(true); }));
      document.getElementById('chat-search')?.addEventListener('input', (e) => { state.searchQuery = e.target.value; const p = e.target.selectionStart; render(); const el = document.getElementById('chat-search'); if (el) { el.focus(); el.setSelectionRange(p, p); } });
      document.getElementById('btn-dismiss-ann')?.addEventListener('click', () => { state.annDismissed = true; render(); });
      document.getElementById('composer')?.addEventListener('submit', sendMessage);
      document.getElementById('composer-input')?.addEventListener('input', (e) => { state.composerText = e.target.value; });
      document.getElementById('btn-emoji')?.addEventListener('click', () => { state.showEmoji = !state.showEmoji; render(); });
      document.querySelectorAll('.em-btn').forEach(b => b.addEventListener('click', () => { state.composerText += b.dataset.em; state.showEmoji = false; render(); document.getElementById('composer-input')?.focus(); }));
      document.querySelectorAll('.btn-edit').forEach(b => b.addEventListener('click', () => { state.editingMsgId = b.dataset.editId; state.editingText = b.dataset.editText; render(); document.getElementById('edit-input')?.focus(); }));
      document.querySelectorAll('.btn-del').forEach(b => b.addEventListener('click', () => deleteMessage(b.dataset.delId)));
      const edIn = document.getElementById('edit-input');
      if (edIn) {
        edIn.addEventListener('input', (e) => { state.editingText = e.target.value; });
        edIn.addEventListener('keydown', (e) => { if (e.key === 'Escape') { state.editingMsgId = null; render(); } if (e.key === 'Enter') saveEdit(state.editingMsgId); });
      }
      document.querySelectorAll('.btn-save-edit').forEach(b => b.addEventListener('click', () => saveEdit(b.dataset.save)));
      document.getElementById('btn-cancel-edit')?.addEventListener('click', () => { state.editingMsgId = null; render(); });
      document.querySelectorAll('.atab-btn').forEach(b => b.addEventListener('click', () => { state.adminTab = b.dataset.atab; render(); }));
      document.getElementById('admin-u-search')?.addEventListener('input', (e) => { state.adminUserSearch = e.target.value; const p = e.target.selectionStart; render(); const el = document.getElementById('admin-u-search'); if (el) { el.focus(); el.setSelectionRange(p, p); } });
      document.getElementById('admin-m-search')?.addEventListener('input', (e) => { state.adminMsgSearch = e.target.value; const p = e.target.selectionStart; render(); const el = document.getElementById('admin-m-search'); if (el) { el.focus(); el.setSelectionRange(p, p); } });
      document.querySelectorAll('.uact-btn').forEach(b => b.addEventListener('click', () => {
        const u = state.users.find(x => x.id === b.dataset.uid);
        if (!u) return;
        if (b.dataset.uact === 'role') adminUpdateUser(u.id, { role: u.role === 'admin' ? 'member' : 'admin' }, `${u.name} role updated`);
        if (b.dataset.uact === 'mute') adminUpdateUser(u.id, { muted: !u.muted }, `${u.name} ${!u.muted ? 'muted' : 'unmuted'}`);
        if (b.dataset.uact === 'ban') adminUpdateUser(u.id, { banned: !u.banned }, `${u.name} ${!u.banned ? 'banned' : 'unbanned'}`);
      }));
      document.getElementById('admin-ch-form')?.addEventListener('submit', adminCreateRoom);
      document.querySelectorAll('.del-room-btn').forEach(b => b.addEventListener('click', () => adminDeleteRoom(b.dataset.delRoom)));
      document.getElementById('admin-ann-form')?.addEventListener('submit', adminBroadcast);
    }

    function onSignedIn(user) {
      state.sessionUser = user;
      if (!state.me) {
        state.me = {
          id: user.id,
          name: user.user_metadata?.name || (user.email || 'User').split('@')[0],
          email: user.email || '',
          role: 'member',
          muted: false,
          banned: false,
          color: '#6366f1',
        };
      }
      render();
      setTimeout(() => {
        setupRealtime();
        loadWorkspaceData(true);
      }, 0);
    }

    sb.auth.onAuthStateChange((_event, session) => {
      if (session?.user) {
        onSignedIn(session.user);
      } else {
        state.sessionUser = null;
        state.me = null;
        render();
      }
    });

    sb.auth.getSession().then(({ data }) => {
      if (data?.session?.user) onSignedIn(data.session.user);
      else render();
    });
  </script>
</body>
</html>
